spring:
  application:
    name: orders-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      # Kept modest on purpose: Cloud SQL IAM auth has a per-user connection limit and
      # the Cloud Run service is capped at a small instance count.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  graphql:
    graphiql:
      # Enabled only for local demos; the CI pipeline exports the schema instead.
      enabled: ${GRAPHIQL_ENABLED:false}
    schema:
      printer:
        enabled: false

  mvc:
    problemdetails:
      enabled: true

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: orders-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: false

logging:
  level:
    root: INFO
    org.springframework.jdbc.core: INFO
